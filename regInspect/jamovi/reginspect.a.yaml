---
name: regInspect
title: Regression Inspector
menuGroup: Regression
menuTitle: Regression Inspector
menuSubtitle: Linear regression with observed-data & descriptive plots
version: '0.1.0'
jas: '1.2'
weightsSupport: 'full'

description:
    main: >
        A clone of jmv's Linear Regression, exploring the relationship
        between a continuous dependent variable and one or more continuous
        and/or categorical explanatory variables, with scatter plots added
        throughout: observed data (partial residuals by default, or raw
        values) and prediction intervals on the Estimated Marginal Means
        plots, and a separate Plots tab with descriptive scatter/box plots
        of the analysed variables.
    R:
        dontrun: false
        usage: |
            data('Prestige', package='carData')

            regInspect(data = Prestige, dep = income,
                   covs = vars(education, prestige, women),
                   blocks = list(list('education', 'prestige', 'women')))

            #
            #  REGRESSION INSPECTOR
            #
            #  Model Fit Measures
            #  ───────────────────────────
            #    Model    R        R²
            #  ───────────────────────────
            #        1    0.802    0.643
            #  ───────────────────────────
            #
            #
            #  MODEL SPECIFIC RESULTS
            #
            #  MODEL 1
            #
            #
            #  Model Coefficients
            #  ────────────────────────────────────────────────────────
            #    Predictor    Estimate    SE         t         p
            #  ────────────────────────────────────────────────────────
            #    Intercept      -253.8    1086.16    -0.234     0.816
            #    women           -50.9       8.56    -5.948    < .001
            #    prestige        141.4      29.91     4.729    < .001
            #    education       177.2     187.63     0.944     0.347
            #  ────────────────────────────────────────────────────────
            #

options:
    - name: data
      type: Data
      description:
          R: the data as a data frame

    - name: dep
      type: Variable
      title: Dependent Variable
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          R: >
            the dependent variable from `data`, variable must be numeric

    - name: covs
      title: Covariates
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric
      default:
      description:
          R: the covariates from `data`

    - name: factors
      title: Factors
      type: Variables
      rejectUnusedLevels: true
      suggested:
        - nominal
      permitted:
        - factor
      default:
      description:
          R: the fixed factors from `data`

    - name: weights
      type: Variable
      title: Weights (optional)
      suggested:
        - continuous
      permitted:
        - numeric
      default:
      description:
          R: the (optional) weights from `data` to be used in the fitting process

    - name: blocks
      title: Blocks
      type: Array
      default: [[]]
      template:
          type: Terms
      description:
          R: >
            a list containing vectors of strings that name the
            predictors that are added to the model. The elements
            are added to the model according to their order in the
            list

    - name: refLevels
      title: Reference Levels
      type: Array
      default:
      template:
          type: Group
          elements:
              - name: var
                type: Variable
              - name: ref
                type: Level
      description:
          R: >
            a list of lists specifying reference levels of the dependent variable
            and all the factors

    - name: intercept
      title: Intercept
      type: List
      options:
        - refLevel
        - grandMean
      default: refLevel
      description:
          R: >
            `'refLevel'` (default) or `'grandMean'`, coding of the intercept. Either
            creates contrast so that the intercept represents the reference level or
            the grand mean

    - name: r
      title: R
      type: Bool
      default: true
      description:
          R: >
            `TRUE` (default) or `FALSE`, provide the statistical measure `R` for the models

    - name: r2
      title: R²
      type: Bool
      default: true
      description:
          R: >
            `TRUE` (default) or `FALSE`, provide the statistical measure `R-squared` for the models

    - name: r2Adj
      title: Adjusted R²
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide the statistical measure `adjusted R-squared` for the models

    - name: aic
      title: AIC
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide Akaike's Information Criterion (AIC)
            for the models

    - name: bic
      title: BIC
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide Bayesian Information Criterion (BIC)
            for the models

    - name: rmse
      title: RMSE
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide RMSE for the models

    - name: modelTest
      title: F test
      type: Bool
      default: false
      description:
          R: >
            `TRUE` (default) or `FALSE`, provide the model comparison between
            the models and the NULL model

    - name: anova
      title: ANOVA test
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide the omnibus ANOVA test
            for the predictors

    - name: ci
      title: Confidence interval
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide a confidence interval
            for the model coefficients

    - name: ciWidth
      title: Confidence level
      type: Number
      min: 50
      max: 99.9
      default: 95
      description:
          R: >
            a number between 50 and 99.9 (default: 95) specifying the confidence
            interval width

    - name: stdEst
      title: Standardized estimate
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide a standardized estimate
            for the model coefficients

    - name: ciStdEst
      title: Confidence interval
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide a confidence interval
            for the model coefficient standardized estimates

    - name: ciWidthStdEst
      title: Confidence level
      type: Number
      min: 50
      max: 99.9
      default: 95
      description:
          R: >
            a number between 50 and 99.9 (default: 95) specifying the confidence
            interval width

    - name: norm
      title: Normality test
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), perform a Shapiro-Wilk test on the
            residuals

    - name: qqPlot
      title: Q-Q plot of residuals
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide a Q-Q plot of residuals

    - name: resPlots
      title: Residual plots
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide residual plots where
            the dependent variable and each covariate is plotted against
            the standardized residuals.

    - name: durbin
      title: Autocorrelation test
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide results of the Durbin-
            Watson test for autocorrelation

    - name: collin
      title: Collinearity statistics
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide VIF and tolerance
            collinearity statistics

    - name: cooks
      title: Cook's distance
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide summary statistics for
            the Cook's distance

    - name: mahal
      title: Mahalanobis distance
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide a summary table reporting
            (significant) Mahalanobis distances

    - name: mahalp
      title: ""
      type: List
      options:
        - "0.05"
        - "0.01"
        - "0.001"
      default: "0.001"
      description:
          R: >
            `'0.05'`, `'0.01'` or `'0.001'` (default), p-threshold to be used
            for selecting entries in the summary table that reports Mahalanobis
            distances that are significant at that p-threshold

    - name: emMeans
      title: Marginal Means
      type: Array
      default: [[]]
      template:
          type: Variables
      description:
          R: >
            a formula containing the terms to estimate marginal means for,
            supports up to three variables per term

    - name: ciEmm
      title: Confidence interval
      type: Bool
      default: true
      description:
          R: >
            `TRUE` (default) or `FALSE`, provide a confidence interval
            for the estimated marginal means

    - name: ciWidthEmm
      title: Confidence level
      type: Number
      min: 50
      max: 99.9
      default: 95
      description:
          R: >
            a number between 50 and 99.9 (default: 95) specifying the confidence
            interval width for the estimated marginal means

    - name: emmPlots
      title: Marginal means plots
      type: Bool
      default: true
      description:
          R: >
            `TRUE` (default) or `FALSE`, provide estimated marginal means plots

    - name: emmTables
      title: Marginal means tables
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), provide estimated marginal means tables

    - name: emmWeights
      title: Equal cell weights
      type: Bool
      default: true
      description:
          R: >
            `TRUE` (default) or `FALSE`, weigh each cell equally or weigh them according to
            the cell frequency

    - name: emmPoints
      title: Observed data
      type: List
      options:
        - name: none
          title: None
        - name: partial
          title: Partial residuals
        - name: raw
          title: Raw values
      default: partial
      description:
          ui: >
              draw the analysed observations on the marginal means plot.
              'Partial residuals' (default) adds back each observation's
              residual to the plotted term's own fitted contribution, so the
              cloud stays correct on the plot's adjusted scale -- with a
              single predictor this is identical to the raw dependent
              variable. 'Raw values' plots the dependent variable itself,
              which is only on the same scale as the plot when the model has
              no other predictors. Suppressed on an axis that bins a
              covariate to -1SD/Mean/+1SD, where no observation has a real
              position.
          R: >
            `'none'`, `'partial'` (default) or `'raw'`, whether and how to
            draw the observed data on the marginal means plots

    - name: piEmm
      title: Prediction interval
      type: Bool
      default: false
      description:
          ui: >
              a prediction interval band/bars alongside the confidence
              interval, describing where a new observation at the plotted
              reference point would be expected to fall.
          R: >
            `TRUE` or `FALSE` (default), provide a prediction interval
            for the estimated marginal means plots

    - name: scatDep
      title: Dependent vs. covariates
      type: Bool
      default: false
      description:
          ui: an annotated scatterplot (fitted line, r, p, equation) of the dependent variable against each covariate.
          R: '`TRUE` or `FALSE` (default), provide a scatterplot of the dependent variable against each covariate'

    - name: boxDep
      title: Dependent by factors
      type: Bool
      default: false
      description:
          ui: a box/violin plot of the dependent variable by each factor.
          R: '`TRUE` or `FALSE` (default), provide a box/violin plot of the dependent variable by each factor'

    - name: boxType
      title: Shape
      type: List
      options:
        - name: box
          title: Box plot
        - name: violin
          title: Violin plot
      default: box
      description:
          R: '`''box''` (default) or `''violin''`, the shape of the dependent-by-factor plots'

    - name: boxPoints
      title: Show points
      type: Bool
      default: true
      description:
          R: '`TRUE` (default) or `FALSE`, overlay jittered points on the dependent-by-factor plots'

    - name: scatMatrix
      title: Scatterplot matrix
      type: Bool
      default: false
      description:
          ui: a matrix of small scatterplots for the dependent variable and every covariate.
          R: '`TRUE` or `FALSE` (default), provide a scatterplot matrix of the dependent variable and the covariates'

    - name: groupVar
      title: Colour by
      type: Variable
      suggested:
        - nominal
      permitted:
        - factor
      default:
      description:
          ui: colours points by this factor in the descriptive scatterplots and the scatterplot matrix.
          R: >
            a string naming a factor in `data` to colour points by in the
            descriptive scatterplots and scatterplot matrix, or `NULL`
            (default) for none

    - name: groupLines
      title: Separate fitted line per group
      type: Bool
      default: false
      description:
          ui: with 'Colour by' set, fit and draw one line (and band) per group instead of one overall line.
          R: >
            `TRUE` or `FALSE` (default), with `groupVar` set, fit a separate
            line per group instead of one overall line

    - name: descLine
      title: Fitted line
      type: Bool
      default: true
      description:
          R: '`TRUE` (default) or `FALSE`, draw the fitted regression line on the descriptive scatterplots'

    - name: descAnnot
      title: Annotation
      type: Bool
      default: true
      description:
          ui: show r, p and the fitted line's equation on each descriptive scatterplot.
          R: '`TRUE` (default) or `FALSE`, show r, p and the fitted line''s equation on the descriptive scatterplots'

    - name: descCIBand
      title: Confidence band
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), draw a confidence band on the descriptive scatterplots'

    - name: descPIBand
      title: Prediction band
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), draw a prediction band on the descriptive scatterplots'

    - name: predictOV
      title: Predicted values
      type: Output

    - name: residsOV
      title: Residuals
      type: Output

    - name: cooksOV
      title: Cook's distance
      type: Output

    - name: mahalOV
      title: Mahalanobis distance
      type: Output

...
